<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajneesh Singh</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0f1a;
      color: #fff;
      overflow-x: hidden;
    }

    /* Animated gradient background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1f1c2c, #928dab, #2c5364);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      z-index: -2;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Particle canvas */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 30px;
      max-width: 420px;
      margin: 80px auto;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      transform: translateY(40px);
      opacity: 0;
      transition: all 1s ease;
    }
    .card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .card img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(255,255,255,0.6);
      animation: pulse 3s infinite;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 10px;
    }
    p {
      margin: 6px 0;
      font-size: 1rem;
      opacity: 0.9;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      background: linear-gradient(135deg, #ff6f61, #ff3b2e);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: transform 0.3s, box-shadow 0.3s;
      display: inline-block;
    }
    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 15px rgba(255,255,255,0.5); }
      50% { box-shadow: 0 0 35px rgba(255,255,255,0.9); }
      100% { box-shadow: 0 0 15px rgba(255,255,255,0.5); }
    }

    @media (max-width: 480px) {
      .card { padding: 20px; margin: 40px auto; }
      h1 { font-size: 1.6rem; }
      .btn { padding: 10px 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="card" id="profileCard">
    <img src="assets/rajneesh.jpg" alt="Rajneesh Singh">
    <h1>Rajneesh Singh</h1>
    <p><strong>Email:</strong> rajneesh@aurr.co.in</p>
    <p><strong>Phone:</strong> 9711887501</p>
    <p><strong>Location:</strong> Ghaziabad</p>
    <p><strong>Qualification:</strong> CEO, Masters in Business Administration</p>
    <p><strong>Likes:</strong> Playing Table Tennis 🏓</p>
    <div class="buttons">
      <a href="tel:9711887501" class="btn">📞 Call</a>
      <a href="mailto:rajneesh@aurr.co.in" class="btn">✉️ Email</a>
      <a href="https://wa.me/919711887501" class="btn">💬 WhatsApp</a>
    </div>
  </div>

  <script>
    // Reveal animation on scroll
    const card = document.getElementById('profileCard');
    window.addEventListener('scroll', () => {
      const rect = card.getBoundingClientRect();
      if (rect.top < window.innerHeight - 100) {
        card.classList.add('visible');
      }
    });

    // Particle background
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function initParticles() {
      particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2 + 1,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5
        });
      }
    }
    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(drawParticles);
    }
    initParticles();
    drawParticles();
  </script>
</body>
</html>
